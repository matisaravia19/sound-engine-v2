[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "h5py>=3.16.0",
    "numpy>=2.4.6",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
